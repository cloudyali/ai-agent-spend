name: release

# Push a semver tag → GoReleaser builds every platform, signs the checksums,
# cuts the GitHub Release, and updates the Homebrew tap. Nothing else triggers it.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the Release and upload assets

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags so the changelog is correct

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod # single source of truth for the Go version
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Default token: creates the Release in THIS repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Separate PAT (contents:write on cloudyali/homebrew-tap) — the default
          # token cannot push to another repo. Create it, save as this secret.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  # The menu-bar app (cmd/aispend-bar) is cgo + AppKit: it can't cross-compile on the
  # Linux goreleaser runner, and OSS goreleaser has no .app/.dmg builder — so it ships
  # from a companion macOS job via scripts/release-bar.sh (à la OpenUsage's release.sh).
  # The CLI job above is unchanged.
  menubar:
    runs-on: macos-latest
    needs: goreleaser # the Release for this tag exists; we attach the .dmg to it
    permissions:
      contents: write
    env:
      # Present only when Phase 2 signing is configured; guards the cert-import + sign steps.
      HAS_CERT: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # cmd/aispend-bar is cgo + Cocoa/WebKit (bar.h + bar_darwin.m) and pulls no external
      # Go UI dependency, so there's nothing extra to fetch — `go build` resolves everything
      # from go.mod. (The old menuet backend was dropped for the WKWebView popover.)

      # Phase 2 — import the Developer ID cert into a temporary keychain. Skipped entirely
      # when the APPLE_CERTIFICATE secret is absent (Phase 1 → unsigned build).
      - name: Import Developer ID certificate
        if: ${{ env.HAS_CERT != '' }}
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Read the imported identity's name back out of the keychain into GITHUB_ENV, so the
      # build step signs against it without anyone hand-copying the identity string.
      - name: Resolve signing identity
        if: ${{ env.HAS_CERT != '' }}
        run: |
          IDENTITY="$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          [ -n "$IDENTITY" ] || { echo "no Developer ID Application identity in the imported cert" >&2; exit 1; }
          echo "APPLE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build the .dmg (universal → .app → dmg; signs + notarizes when Phase 2 secrets are set)
        env:
          VERSION: ${{ github.ref_name }}
          # APPLE_SIGN_IDENTITY is injected via GITHUB_ENV by "Resolve signing identity" when
          # Phase 2 is on; unset → release-bar.sh ad-hoc-signs (Phase 1). The notary creds
          # below drive notarize + staple (ignored in Phase 1).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/release-bar.sh "${GITHUB_REF_NAME}"

      - name: Attach the .dmg to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/aispend-bar-*.dmg

      - name: Publish the Homebrew cask
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # Notarized (Phase 2) → the cask omits the quarantine-strip postflight.
          NOTARIZED: ${{ env.HAS_CERT != '' && 'yes' || '' }}
        run: bash scripts/update-bar-cask.sh "${GITHUB_REF_NAME}"
